name: Generate Snake Contribution Animation

on:
  schedule:
    # Automatically run every 24 hours (at 00:00 UTC)
    - cron: "0 0 * * *"
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
  
  # Run on push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Naomi002
          outputs: |
            assets/animations/github-contribution-grid-snake.svg
            assets/animations/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and Push Generated Animations
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/animations/github-contribution-grid-snake*.svg
          git diff --staged --quiet || (git commit -m "chore: update contribution snake animation [skip ci]" && git push)
